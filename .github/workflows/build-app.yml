name: Build and Package EXE
on: [push]
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build and Package Executable
        run: npm run make
        # לחלופין, אם אתה משתמש ב-pkg או כלי אחר, החלף פה את הפקודה לסקריפט האריזה שלך

      - name: Upload Artifact (EXE)
        uses: actions/upload-artifact@v4
        with:
          name: meo-studio-exe
          path: out/
